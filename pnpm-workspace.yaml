# Supply-chain hardening. Reference: https://pnpm.io/settings

# Ignore versions under 3 days old; most malicious
# releases are pulled within that window.
minimumReleaseAge: 4320

# Fail if a package's publish provenance gets weaker than before
# (typical of a stolen npm token).
trustPolicy: no-downgrade

# Sub-dependencies must come from the registry, not git URLs or tarballs.
blockExoticSubdeps: true

# Install scripts are denied unless listed below;
# a new one fails the install until reviewed.
strictDepBuilds: true
allowBuilds:
  # Both ship prebuilt binaries; their scripts are only a fallback.
  sharp: false
  unrs-resolver: false

# These eslint-config-next plugins don't list ESLint 10 yet.
# Verified working; ESLint 9 is out of support.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'

engineStrict: true
verifyStoreIntegrity: true

# `pnpm add` pins exact versions.
savePrefix: ''
