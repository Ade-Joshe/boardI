name: PR title

# Squash merges use the PR title as the commit message, so it must
# follow Conventional Commits (docs/standards/).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Title passes via env, never inlined into the script (injection).
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([a-z0-9-]+\))?!?: .+$" || {
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(auth): add login'."
            exit 1
          }
